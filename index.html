<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="珍食同萌：晚鳥惜食盲盒，校門口小店收攤前的現做好料 4 到 5 折帶走。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>珍食同萌 Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: a regular website. Sticky top nav (student pages + 店家後台), one view at a time; student home = night banner, then store list beside a sticky street map. Palette from the SAVE EATS badge. */
:root{
  --bg:#F2ECD8; --bg2:#E8E0C6; --ink:#1D2A22; --muted:#5D6A5E; --brand:#1F4A36;
  --btn:#1F4A36; --btnText:#FFFCF2; --sprout:#5F8F45; --sproutSoft:#E3EBD2; --gold:#A97F28; --goldSoft:#F3E6C4;
  --surface:#FFFCF3; --line:#DDD3B6; --road:#FFFFFF; --danger:#A9432F; --muted2:#9AA096;
  --night1:#163528; --night2:#24503A; --nightText:#FFF8E6; --moon:#E8C76A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --bg2:#15211B; --ink:#EAE5D2; --muted:#A0AB9D; --brand:#A8D49A;
  --btn:#8CC48A; --btnText:#0E1612; --sprout:#8CC48A; --sproutSoft:#1F3326; --gold:#D8B35C; --goldSoft:#3A3220;
  --surface:#18241E; --line:#2D3D33; --road:#24342B; --danger:#E08A74; --muted2:#5E685F;
  --night1:#0B1D15; --night2:#1C3D2C; --nightText:#FFF8E6; --moon:#E8C76A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --bg2:#15211B; --ink:#EAE5D2; --muted:#A0AB9D; --brand:#A8D49A;
  --btn:#8CC48A; --btnText:#0E1612; --sprout:#8CC48A; --sproutSoft:#1F3326; --gold:#D8B35C; --goldSoft:#3A3220;
  --surface:#18241E; --line:#2D3D33; --road:#24342B; --danger:#E08A74; --muted2:#5E685F;
  --night1:#0B1D15; --night2:#1C3D2C; --nightText:#FFF8E6; --moon:#E8C76A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:15px;padding-block:0 32px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;line-height:1.3}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.nav .in{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.logo img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.logo b{font-family:var(--serif);font-weight:900;font-size:1.3rem;color:var(--brand);letter-spacing:.06em}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--sproutSoft);color:var(--brand);font-weight:700}
.tabs .badge{display:inline-block;min-width:18px;height:18px;border-radius:99px;background:var(--gold);color:#fff;font-size:.7rem;line-height:18px;text-align:center;margin-left:4px;padding:0 5px}
.who{font-size:.82rem;color:var(--muted);white-space:nowrap}
.mtab{border:1px solid var(--brand);color:var(--brand);background:none;border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.mtab[aria-current="page"]{background:var(--brand);color:var(--btnText)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;list-style:none;padding:0;margin:18px 0 0}
.steps li{border-top:3px solid var(--line);padding-top:6px;font-size:.8rem;color:var(--muted);min-width:0}
.steps li b{display:block;font-size:.9rem;color:var(--ink)}
.steps li.on{border-color:var(--sprout)}
.steps li.now{border-color:var(--gold)}
.steps li.now b{color:var(--gold)}

/* common */
main{padding-top:22px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:12px;padding:12px 20px;background:var(--btn);color:var(--btnText);font-weight:700;font-size:.95rem}
.btn.block{display:flex;width:100%}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.line{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.gold{background:var(--gold);color:var(--btnText)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.note{font-size:.8rem;color:var(--muted)}
.ok{color:var(--sprout);font-weight:700}
.err{color:var(--danger)}
.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:12px;font-size:.9rem}
.back:hover{color:var(--brand)}
.lr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag{font-size:.72rem;padding:1px 8px;border-radius:6px;background:var(--sproutSoft);color:var(--brand)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--goldSoft);color:var(--gold);white-space:nowrap}
.pill.ok{background:var(--sproutSoft);color:var(--brand)}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
.stat small{display:block;color:var(--muted);font-size:.78rem}
.stat b{font-size:1.6rem;color:var(--brand)}
.stat b em{font-style:normal;font-size:.8rem;margin-left:3px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* banner */
.banner{position:relative;overflow:hidden;border-radius:22px;padding:28px 30px;background:linear-gradient(150deg,var(--night1),var(--night2));color:var(--nightText);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.banner .moon{position:absolute;right:42px;top:22px;width:46px;height:46px;border-radius:50%;box-shadow:-10px 6px 0 0 var(--moon);transform:rotate(-20deg)}
.banner .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#F3DFA2}
.banner small{color:var(--moon);letter-spacing:.16em;font-size:.75rem;font-weight:700}
.banner h1{margin:6px 0 6px;font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:900}
.banner p{margin:0;opacity:.85;max-width:46ch}
.bstats{display:flex;gap:22px;position:relative}
.bstats div{text-align:left}
.bstats b{display:block;font-family:var(--serif);font-size:1.8rem;color:var(--moon);line-height:1.1}
.bstats span{font-size:.78rem;opacity:.8}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin-top:22px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem}
.filters button[aria-pressed="true"]{background:var(--brand);color:var(--btnText);border-color:var(--brand)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0;width:100%}
.card:hover{border-color:var(--sprout)}
.card.out{opacity:.55;cursor:not-allowed}
.card .top{height:86px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px;color:#fff;position:relative}
.card .top .mono{font-family:var(--serif);font-weight:900;font-size:2.2rem;line-height:1;opacity:.9}
.card .off{background:var(--surface);color:var(--danger);font-weight:700;font-size:.78rem;border-radius:8px;padding:2px 8px}
.card .cb{padding:12px 14px 14px;display:grid;gap:6px}
.card h3{margin:0;font-size:1.05rem}
.card .meta{font-size:.8rem;color:var(--muted)}
.card .pr b{font-size:1.35rem;color:var(--brand)}
.card .pr s{font-size:.8rem;color:var(--muted);margin-left:6px}
.left{font-size:.8rem;font-weight:700;color:var(--gold)}
.left.out{color:var(--muted)}
.mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.map{position:relative;height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:
  linear-gradient(90deg,transparent 47%,var(--road) 47%,var(--road) 53%,transparent 53%),
  linear-gradient(0deg,transparent 30%,var(--road) 30%,var(--road) 35%,transparent 35%),
  linear-gradient(0deg,transparent 70%,var(--road) 70%,var(--road) 74%,transparent 74%),
  linear-gradient(90deg,transparent 15%,var(--road) 15%,var(--road) 18%,transparent 18%),
  var(--sproutSoft)}
.map .gate{position:absolute;left:41%;bottom:8px;font-size:.75rem;font-weight:700;background:var(--brand);color:var(--btnText);padding:2px 10px;border-radius:6px}
.map .me{position:absolute;left:49%;bottom:36px;width:16px;height:16px;border-radius:50%;background:#3A8FD6;box-shadow:0 0 0 6px rgba(58,143,214,.25)}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:var(--gold);color:#fff;font-size:.75rem;font-weight:700;border-radius:10px 10px 10px 2px;padding:4px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pin.out{background:var(--muted2)}
.pin.dim{opacity:.3}
.legend{display:flex;gap:14px;margin-top:8px;font-size:.78rem;color:var(--muted)}

/* store / pay */
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.shero{border-radius:22px;padding:28px;color:#fff;display:grid;gap:6px}
.shero small{opacity:.85}
.shero h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.2rem)}
.shero .row{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;opacity:.92}
.box{margin-top:16px;border:1.5px dashed var(--gold);background:var(--goldSoft);border-radius:16px;padding:16px 18px}
.box h2{margin:0 0 4px;font-size:1.05rem}
.box p{margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.order{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.order h2{margin:0;font-size:1.15rem}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--bg2);width:38px;height:36px;font-size:1.1rem}
.stepper span{width:40px;text-align:center;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--sprout)}
.check small{display:block;color:var(--muted);font-size:.78rem}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);text-transform:uppercase}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:12px}
.total b{font-size:1.6rem;color:var(--brand)}
.receipt{display:grid;gap:10px}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:2px 0;width:100%}
.paymethod{display:flex;gap:12px;align-items:center;border:1.5px solid var(--sprout);border-radius:14px;padding:12px 14px}
.paymethod .dot{width:18px;height:18px;border-radius:50%;border:5px solid var(--sprout);flex:none}
.warn{font-size:.8rem;color:var(--gold);background:var(--goldSoft);border-radius:10px;padding:8px 12px;margin:0}
h1.page{margin:0 0 16px;font-size:1.7rem;color:var(--brand)}

/* ticket */
.ticket{display:grid;grid-template-columns:260px minmax(0,1fr);border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.ticket .qrside{background:linear-gradient(160deg,var(--night1),var(--night2));color:var(--nightText);display:grid;place-items:center;gap:10px;padding:26px 16px;text-align:center}
.qr{background:#fff;padding:10px;border-radius:12px;width:180px;height:180px;display:grid;place-items:center}
.qr img,.qr canvas{width:160px!important;height:160px!important}
.code{font-weight:900;letter-spacing:.2em;font-size:1.3rem}
.ticket .info{padding:24px 26px;display:grid;gap:12px;align-content:start}
.ticket .info h2{margin:0;font-size:1.4rem;color:var(--brand)}
.count{font-size:.9rem;color:var(--muted)}
.count b{color:var(--gold);font-size:1.15rem}

/* done / points */
.done{max-width:640px;margin:0 auto;text-align:center;display:grid;gap:16px}
.seal{width:130px;height:130px;margin:0 auto;border-radius:50%;background:var(--sproutSoft);display:grid;place-items:center;font-family:var(--serif);font-weight:900;color:var(--brand);font-size:1.2rem;border:3px double var(--sprout)}
.done h1{margin:0;color:var(--brand)}
.done .stats{text-align:left}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pcard{border-radius:22px;padding:24px;background:linear-gradient(160deg,var(--night1),var(--night2));color:var(--nightText)}
.pcard small{opacity:.8}
.pcard .big{font-size:2.4rem;font-weight:900;font-family:var(--serif)}
.meter{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--moon);border-radius:99px}
.stamps{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px}
.stamps span{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(255,255,255,.4);display:grid;place-items:center;font-size:.72rem}
.stamps span.on{background:var(--moon);border-color:var(--moon);color:var(--night1);font-weight:900}
.rewards{display:grid;gap:12px}
.reward{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.reward h3{margin:0;font-size:1rem}
.reward p{margin:0;font-size:.8rem;color:var(--muted)}

/* merchant */
.mhead{border-radius:22px;padding:22px 26px;background:linear-gradient(150deg,var(--night1),var(--night2));color:var(--nightText);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.mhead small{opacity:.8}
.mhead h1{margin:2px 0 0;font-size:1.6rem}
.state{font-size:.8rem;font-weight:700;padding:4px 14px;border-radius:999px;background:var(--moon);color:var(--night1)}
.state.off{background:rgba(255,255,255,.2);color:var(--nightText)}
.mgrid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.mgrid h2{margin:0 0 4px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mgrid h2 small{font-family:var(--sans);font-weight:400;font-size:.78rem;color:var(--muted)}
.slider-val{font-size:2.6rem;font-weight:900;color:var(--brand);font-family:var(--serif);line-height:1}
.slider-val em{font-style:normal;font-size:1rem;color:var(--muted);margin-left:4px}
input[type=range]{width:100%;accent-color:var(--sprout)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--sprout);background:var(--sproutSoft);color:var(--brand)}
.toast{font-size:.85rem;color:var(--brand);background:var(--sproutSoft);border-radius:10px;padding:8px 12px;margin:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
th{font-size:.78rem;color:var(--muted);font-weight:700}
td:last-child,th:last-child{text-align:right}

/* grid children may shrink so wide tables scroll inside their panel */
.home>*,.two>*,.mgrid>*,.pgrid>*,.panel{min-width:0}

/* hint */
.hint{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(201,152,48,.75)}100%{box-shadow:0 0 0 12px rgba(201,152,48,0)}}
@media (prefers-reduced-motion:reduce){.hint{animation:none;outline:3px solid var(--gold);outline-offset:2px}}

footer{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
footer button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;color:var(--muted);font-size:.78rem}

@media (max-width:900px){
  .home,.two,.mgrid,.pgrid{grid-template-columns:1fr}
  .mapbox,.order{position:static}
  .mapbox{order:-1}
  .map{height:220px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .ticket{grid-template-columns:1fr}
}
@media (max-width:600px){
  .nav .in{gap:8px;padding-block:8px}
  .who{display:none}
  .tabs{order:3;flex-basis:100%}
  .logo b{font-size:1.15rem}
  .banner{grid-template-columns:1fr;padding:22px 20px}
  .banner .moon{right:20px;top:16px;width:34px;height:34px}
  .cards{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .steps{gap:4px}
  .steps li{font-size:0}
  .steps li b{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stamps{grid-template-columns:repeat(5,1fr)}
}
</style>

</head>

      <div class="filters">${TAGS.map(t=>`<button type="button" data-act="filter" data-tag="${t}" aria-pressed="${t===f}">${t}</button>`).join('')}</div>
      <div class="cards">${cards}</div>
    </section>
    <aside class="mapbox" aria-label="校門口商圈地圖">
      <div class="map">${pins}<span class="me" title="你在這裡"></span><span class="gate">校門口</span></div>
      <div class="legend"><span>● 你在這裡</span><span>數字＝剩餘份數</span><span>首單輸入 SAVEEATS10 折 10 元</span></div>
    </aside>
  </div>`;
}
function priceFor(s){ const sub = s.price * st.s.qty, c = st.s.couponApplied ? COUPON_OFF : 0; return {sub, c, total: Math.max(0, sub - c)}; }
function vStore(){
  const s = store(st.s.storeId);
  if (st.s.qty > s.remaining) st.s.qty = Math.max(1, s.remaining);
  const p = priceFor(s), can = s.remaining > 0;
  return `<button type="button" class="back" data-act="go" data-to="home">‹ 回到今晚盲盒</button>
  <div class="two">
    <div>
      <div class="shero" style="background:${s.color}"><small>晚鳥惜食盲盒</small><h1>${esc(s.name)}</h1>
        <div class="row"><span>步行 ${s.walk} 分鐘</span><span>${s.closes} 打烊</span><span class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</span></div></div>
      <div class="box"><h2>盲盒裡可能有</h2><p>${esc(s.box)}</p></div>
      <div class="facts">
        <div class="stat"><small>取餐時段</small><b style="font-size:1.15rem">${s.pickup}</b></div>
        <div class="stat"><small>今晚剩下</small><b class="num">${s.remaining}<em>份</em></b></div>
        <div class="stat"><small>每份減碳</small><b class="num">${CO2}<em>kg CO₂e</em></b></div>
      </div>
    </div>
    <aside class="panel order">
      <h2>預付鎖貨</h2>
      <div class="lr"><span>惜食價 <s class="note num">原價 $${s.orig}</s></span><b class="num" style="color:var(--brand)">$${s.price} <span class="note">${off(s)}</span></b></div>
      <div class="lr"><span>份數（每人最多 3 份）</span><span class="stepper"><button type="button" data-act="qty" data-d="-1" aria-label="減少">−</button><span class="num">${st.s.qty}</span><button type="button" data-act="qty" data-d="1" aria-label="增加">+</button></span></div>
      <label class="check"><input type="checkbox" id="bowl" ${st.s.bowl?'checked':''}><span>我會自備環保餐盒<small>${esc(s.extra)}，再拿 10 點減碳積分</small></span></label>
      <div><div class="coupon"><input id="coupon" placeholder="優惠碼，例如 SAVEEATS10" value="${esc(st.s.coupon)}" ${st.s.couponApplied?'disabled':''} autocomplete="off"><button type="button" class="btn sm line" data-act="coupon" ${st.s.couponApplied?'disabled':''}>套用</button></div>
        ${st.s.couponMsg?`<p class="note ${st.s.couponApplied?'ok':'err'}" style="margin:6px 0 0">${st.s.couponMsg}</p>`:''}</div>
      <div class="total"><span class="note">小計 $${p.sub}${p.c?`・優惠 −$${p.c}`:''}</span><b class="num">$${p.total}</b></div>
      <button type="button" class="btn block ${can&&!myLatest()?'hint':''}" data-act="go" data-to="pay" ${can?'':'disabled'}>${can?'前往付款，鎖定這份盲盒':'今晚已售完'}</button>
    </aside>
  </div>`;
}
function vPay(){
  const s = store(st.s.storeId), p = priceFor(s);
  return `<button type="button" class="back" data-act="go" data-to="store">‹ 回到 ${esc(s.name)}</button>
  <h1 class="page">確認訂單</h1>
  <div class="two">
    <div class="panel receipt">
      <div class="lr"><span>${esc(s.name)} 惜食盲盒 × ${st.s.qty}</span><span class="num">$${p.sub}</span></div>
      ${p.c?`<div class="lr"><span>首單優惠 SAVEEATS10</span><span class="num ok">−$${p.c}</span></div>`:''}
      ${st.s.bowl?`<div class="lr"><span>自備環保餐盒</span><span class="ok">加菜＋10 點</span></div>`:''}
      <hr><div class="lr"><b>應付金額</b><b class="num" style="font-size:1.5rem;color:var(--brand)">$${p.total}</b></div>
      <div class="lr note"><span>取餐時間</span><span>今天 ${s.pickup}</span></div>
      <div class="lr note"><span>比原價省下</span><span class="num">$${(s.orig-s.price)*st.s.qty + p.c}</span></div>
    </div>
    <aside class="panel order">
      <h2>付款方式</h2>
      <div class="paymethod"><span class="dot"></span><span>行動支付<br><span class="note">正式版串接 LINE Pay，付款後立即保留餐點</span></span></div>
      <p class="warn">示意付款，按下按鈕不會實際扣款。</p>
      <button type="button" class="btn block hint" data-act="pay">確認付款 $${p.total}</button>
    </aside>
  </div>`;
}
function vTicket(){
  const o = st.orders.find(x => x.id === st.s.ticketId);
  if (!o) return `<h1 class="page">我的取餐券</h1><div class="panel" style="display:grid;gap:12px;max-width:520px"><p style="margin:0">你還沒有取餐券。挑一份今晚的盲盒吧。</p><button type="button" class="btn" data-act="go" data-to="home">看今晚盲盒</button></div>`;
  const s = store(o.storeId);
  return `<h1 class="page">我的取餐券</h1>
  <div class="ticket">
    <div class="qrside"><small>到店出示 QR Code</small><div class="qr" id="qr" aria-label="取餐 QR Code"></div><div class="code num">${o.id}</div></div>
    <div class="info">
      <span class="pill" style="justify-self:start">已付款・餐點保留中</span>
      <h2>${esc(s.name)}</h2>
      <div class="lr"><span>取餐時段</span><b>今天 ${s.pickup}</b></div>
      <div class="lr"><span>份數</span><span>${o.qty} 份${o.bowl?'・自備餐盒':''}</span></div>
      <div class="lr"><span>已付金額</span><span class="num">$${o.total}</span></div>
      <div class="lr"><span>位置</span><span>校門口步行 ${s.walk} 分鐘</span></div>
      <p class="count" style="margin:4px 0 0">距離開放取餐還有 <b class="num">25 分鐘</b>，取餐前 15 分鐘會再提醒你</p>
      <div class="actions" style="justify-content:flex-start">
        <button type="button" class="btn line hint" data-act="selfscan">模擬到店掃碼取餐</button>
        <button type="button" class="btn line" data-act="go" data-to="merchant">切換到店家後台核銷</button>
      </div>
    </div>
  </div>`;
}
function vDone(){
  const o = myLatest(), s = store(o.storeId);
  return `<div class="done">
    <div class="seal">取餐成功</div>
    <h1>今晚的晚餐救到了</h1>
    <p class="note" style="margin:0">${esc(s.name)} 的 ${o.qty} 份盲盒已交到你手上${o.bowl?'，謝謝你自備餐盒':''}</p>
    <div class="stats">
      <div class="stat"><small>這一餐省下</small><b class="num">$${o.saved}</b></div>
      <div class="stat"><small>減少碳排</small><b class="num">${kg(o.qty*CO2)}<em>kg</em></b></div>
      <div class="stat"><small>獲得積分</small><b class="num">+${10+(o.bowl?10:0)}<em>點</em></b></div>
      <div class="stat"><small>救下的食物</small><b class="num">${o.qty}<em>份</em></b></div>
    </div>
    <div class="actions"><button type="button" class="btn hint" data-act="go" data-to="points">查看集點卡</button><button type="button" class="btn line" data-act="go" data-to="home">回到今晚盲盒</button></div>
  </div>`;
}
function vPoints(){
  const u = st.student;
  const pct = Math.min(100, Math.round(u.points / REWARD_COST * 100));
  const stamps = Array.from({length:10},(_,i)=>`<span class="${i<u.meals?'on':''}">${i<u.meals?'惜':i+1}</span>`).join('');
  const can = u.points >= REWARD_COST && !u.redeemed;
  return `<h1 class="page">集點與減碳</h1>
  <div class="pgrid">
    <div class="pcard"><small>林冠宇的減碳積分</small><div class="big num">${u.points} 點</div>
      <div class="meter"><i style="width:${pct}%"></i></div><small>${u.redeemed?'本月兌換券已領取':can?'可以兌換手搖飲折價券了':`再 ${REWARD_COST-u.points} 點可兌換手搖飲折價券`}</small>
      <div class="stamps">${stamps}</div></div>
    <div class="rewards">
      <div class="stats" style="grid-template-columns:1fr 1fr">
        <div class="stat"><small>累積省下</small><b class="num">$${u.saved}</b></div>
        <div class="stat"><small>累積減碳</small><b class="num">${kg(u.co2)}<em>kg CO₂e</em></b></div>
      </div>
      <div class="panel reward"><div><h3>特約手搖飲 折 10 元</h3><p>${REWARD_COST} 點・校門口 3 家飲料店適用</p></div>
        <button type="button" class="btn sm gold ${can?'hint':''}" data-act="redeem" ${can?'':'disabled'}>${u.redeemed?'已兌換':'兌換'}</button></div>
      <div class="panel reward"><div><h3>系所減碳排行榜</h3><p>本週第 2 名・再救 6 份就能超車資管系</p></div><span class="pill ok">第 2 名</span></div>
    </div>
  </div>`;
}

/* ---------- merchant view ---------- */
function vMerchant(){
  const s = store('zhang');
  const mine = st.orders.filter(o => o.storeId === 'zhang');
  const sold = mine.reduce((a,o)=>a+o.qty,0);
  const picked = mine.filter(o=>o.status==='picked').length;
  const earn = mine.reduce((a,o)=>a+Math.round(s.price*SHARE)*o.qty,0);
  const pend = myPending();
  const rows = mine.slice().reverse().map(o => `<tr><td class="num">#${o.id}</td><td>${esc(o.who)}</td><td class="num">${o.qty}</td><td>${o.bowl?'自備餐盒（加滷蛋）':'店家包材'}</td><td class="num">$${o.total}</td>
    <td>${o.status==='picked'?'<span class="pill ok">已取餐</span>':`<button type="button" class="btn sm ${pend&&pend.id===o.id?'hint':''}" data-act="scan" data-id="${o.id}">掃碼核銷</button>`}</td></tr>`).join('');
  return `<section class="mhead"><div><small>店家後台・今晚 21:00 打烊</small><h1>張記家常便當</h1></div><span class="state ${s.remaining?'':'off'}">${s.remaining?`上架中・剩 ${s.remaining} 份`:'今晚未上架'}</span></section>
  <div class="mgrid">
    <section class="panel" style="display:grid;gap:12px">
      <h2>今晚要釋出幾份盲盒？<small>有剩才賣</small></h2>
      <div class="slider-val num" id="sv">${st.m.slider}<em>份</em></div>
      <input type="range" id="slider" min="0" max="15" value="${st.m.slider}" aria-label="盲盒份數">
      <div class="seg" role="group" aria-label="惜食價">${PRICES.map(p=>`<button type="button" data-act="mprice" data-p="${p}" aria-pressed="${p===st.m.price}">$${p}</button>`).join('')}</div>
      <p class="note" style="margin:0">取餐時段固定在打烊前 30 分鐘（20:30–21:00），不影響白天正價客人。沒有剩就設 0 份。</p>
      <button type="button" class="btn block" data-act="publish">${s.remaining?'更新上架份數':'一鍵上架'}</button>
      ${st.m.toast?`<p class="toast">${st.m.toast}</p>`:''}
    </section>
    <div style="display:grid;gap:20px;min-width:0">
      <section class="panel"><h2>今晚訂單<small>學生已預付，不怕放鳥</small></h2>
        <div class="tbl"><table><thead><tr><th>訂單</th><th>取餐人</th><th>份數</th><th>包裝</th><th>已付</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>
      </section>
      <section><h2 style="margin:0 0 10px;font-size:1.1rem">今晚成績</h2>
        <div class="stats">
          <div class="stat"><small>原本要報廢，現在回收</small><b class="num">$${earn}</b></div>
          <div class="stat"><small>已售出／已取餐</small><b class="num">${sold}<em>/ ${picked} 筆</em></b></div>
          <div class="stat"><small>救下的餐點</small><b class="num">${sold}<em>份</em></b></div>
          <div class="stat"><small>減少碳排</small><b class="num">${kg(sold*CO2)}<em>kg</em></b></div>
        </div>
        <p class="note">每份實拿 $${Math.round(s.price*SHARE)}（平台抽成 12%），零上架月費</p>
      </section>
    </div>
  </div>`;
}

/* ---------- render ---------- */
const VIEWS = {home:vHome, store:vStore, pay:vPay, ticket:vTicket, done:vDone, points:vPoints, merchant:vMerchant};
let lastView = null;
function render(){
  const same = lastView === st.s.view, y = window.scrollY;
  $('view').innerHTML = VIEWS[st.s.view]();
  renderNav(); renderSteps();
  $('steps').parentElement.hidden = st.s.view === 'merchant';
  window.scrollTo(0, same ? y : 0);
  lastView = st.s.view;
  const q = $('qr');
  if (q){
    const text = 'SAVEEATS|' + st.s.ticketId;
    if (window.QRCode) new QRCode(q,{text,width:160,height:160,colorDark:'#1F4A36',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    else q.innerHTML = `<span style="color:#1F4A36;font-weight:700">${st.s.ticketId}</span>`;
  }
}
function go(to){ st.s.view = to; render(); }
function pickup(o){
  if (!o || o.status === 'picked') return;
  o.status = 'picked';
  if (o.mine){
    const u = st.student;
    u.saved += o.saved; u.co2 += o.qty*CO2; u.points += 10 + (o.bowl?10:0); u.meals = Math.min(10, u.meals + 1);
    if (st.s.view !== 'merchant') st.s.view = 'done';
  }
  st.m.toast = `已核銷 #${o.id}，${o.who} 取餐完成`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'go') return go(t.dataset.to);
  if (a === 'filter'){ st.s.filter = t.dataset.tag; return render(); }
  if (a === 'store'){ const s = store(t.dataset.id); if (!s.remaining) return; st.s.storeId = s.id; st.s.qty = 1; return go('store'); }
  if (a === 'qty'){ const s = store(st.s.storeId); st.s.qty = Math.max(1, Math.min(s.remaining, 3, st.s.qty + Number(t.dataset.d))); return render(); }
  if (a === 'coupon'){
    const v = ($('coupon').value || '').trim().toUpperCase(); st.s.coupon = v;
    if (st.student.couponUsed) st.s.couponMsg = '首單優惠已經用過了，每人限用一次。';
    else if (v === COUPON){ st.s.couponApplied = true; st.s.couponMsg = '首單優惠已套用，現折 10 元'; }
    else st.s.couponMsg = v ? '找不到這個優惠碼，請確認是 SAVEEATS10' : '請先輸入優惠碼';
    return render();
  }
  if (a === 'pay'){
    const s = store(st.s.storeId), p = priceFor(s);
    if (s.remaining < st.s.qty) return go('store');
    s.remaining -= st.s.qty;
    if (s.id === 'zhang') st.m.slider = s.remaining;
    const o = {id:'A'+(++st.seq), storeId:s.id, who:'林冠宇', qty:st.s.qty, bowl:st.s.bowl, total:p.total, saved:(s.orig-s.price)*st.s.qty + p.c, status:'paid', mine:true};
    st.orders.push(o);
    if (st.s.couponApplied) st.student.couponUsed = true;
    st.s.couponApplied = false; st.s.coupon = ''; st.s.couponMsg = '';
    st.s.ticketId = o.id;
    if (s.id === 'zhang') st.m.toast = `新訂單 #${o.id}：林冠宇 ${o.qty} 份`;
    return go('ticket');
  }
  if (a === 'ticket'){ const p = myPending(), l = myLatest(); st.s.ticketId = p ? p.id : (l ? l.id : null); return go(!p && l ? 'done' : 'ticket'); }
  if (a === 'selfscan'){ pickup(st.orders.find(o=>o.id===st.s.ticketId)); return render(); }
  if (a === 'scan'){ pickup(st.orders.find(o=>o.id===t.dataset.id)); return render(); }
  if (a === 'redeem'){ const u = st.student; if (u.points >= REWARD_COST && !u.redeemed){ u.points -= REWARD_COST; u.redeemed = true; } return render(); }
  if (a === 'mprice'){ st.m.price = Number(t.dataset.p); return render(); }
  if (a === 'publish'){
    const s = store('zhang'); s.remaining = st.m.slider; s.price = st.m.price;
    st.m.toast = s.remaining ? `已上架 ${s.remaining} 份，$${s.price}，學生端已同步更新` : '今晚不開放盲盒，學生端顯示已售完';
    return render();
  }
});
document.addEventListener('change', e => { if (e.target.id === 'bowl'){ st.s.bowl = e.target.checked; render(); } });
document.addEventListener('input', e => {
  if (e.target.id === 'slider'){ st.m.slider = Number(e.target.value); $('sv').innerHTML = `${st.m.slider}<em>份</em>`; }
  if (e.target.id === 'coupon') st.s.coupon = e.target.value;
});
document.addEventListener('keydown', e => { if (e.target.id === 'coupon' && e.key === 'Enter'){ e.preventDefault(); document.querySelector('[data-act="coupon"]').click(); } });
$('reset').addEventListener('click', () => { st = initial(); lastView = null; render(); });
render();
</script>

</body>
</html>
